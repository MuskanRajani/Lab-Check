<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drug Test Panel Matcher</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,sans-serif;margin:0;background:#f5f6f8;color:#222}
  .wrap{max-width:1000px;margin:40px auto;padding:0 20px}
  h1{margin-bottom:8px}
  .sub{color:#666;margin-top:0}
  .card{background:#fff;border-radius:12px;padding:22px;margin:18px 0;box-shadow:0 2px 10px #00000012}
  textarea{width:100%;min-height:110px;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px;resize:vertical}
  button{border:0;border-radius:8px;padding:11px 18px;font-size:15px;cursor:pointer;margin-top:12px}
  .primary{background:#222;color:white}
  .secondary{background:#eee}
  .results{display:grid;gap:12px}
  .result{border:1px solid #ddd;border-radius:10px;padding:16px}
  .match{border-left:5px solid #16803c}
  .partial{border-left:5px solid #c47a00}
  .no{border-left:5px solid #c62828}
  .badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:bold;margin-left:8px;background:#eee}
  .match .badge{background:#e6f5eb;color:#16803c}
  .partial .badge{background:#fff3d8;color:#9a6100}
  .no .badge{background:#fdeaea;color:#b71c1c}
  .missing{color:#b71c1c}
  .extra{color:#666}
  .hint{font-size:13px;color:#777}
</style>
</head>
<body>
<div class="wrap">
  <h1>Drug Test Panel Matcher</h1>
  <p class="sub">Enter the drugs required by the client. The utility compares them with the panels below.</p>

  <div class="card">
    <label><strong>Required drugs</strong></label>
    <textarea id="input" placeholder="Example: Amphetamines, Barbiturates, Benzodiazepines, Cocaine, Methadone, Opiates, Phencyclidine"></textarea>
    <div>
      <button class="primary" onclick="matchPanels()">Find Matching Panels</button>
      <button class="secondary" onclick="document.getElementById('input').value='';document.getElementById('results').innerHTML=''">Clear</button>
    </div>
    <p class="hint">You can use full names or abbreviations such as AMP, BAR, BZP, COC, MTD, OPI, PCP, THC, PPX, 6AM.</p>
  </div>

  <div id="results" class="results"></div>
</div>

<script>
const DRUGS = {
  AMP: "Amphetamines",
  BAR: "Barbiturates",
  BZP: "Benzodiazepines",
  COC: "Cocaine",
  MTD: "Methadone",
  OPI: "Opiates",
  PCP: "Phencyclidine",
  THC: "Marijuana / THC",
  PPX: "Propoxyphene",
  "6AM": "6-Acetylmorphine / Heroin metabolite",
  MDM: "Methaqualone",
  NIT: "Nitrite",
  OXC: "Oxycodone / Oxymorphone",
  FNL: "Fentanyl",
  CREA: "Urine Creatinine",
  PH: "Urine pH",
  CODMOR: "Codeine / Morphine"
};

const ALIASES = {
  "AMPHETAMINES":"AMP","AMPHETAMINE":"AMP","AMP":"AMP",
  "BARBITURATES":"BAR","BAR":"BAR",
  "BENZODIAZEPINES":"BZP","BZP":"BZP","BENZOS":"BZP",
  "COCAINE":"COC","COC":"COC","COCAINE METABOLITE":"COC",
  "METHADONE":"MTD","MTD":"MTD","METHADONE MTB":"MTD",
  "OPIATES":"OPI","OPIATE":"OPI","OPI":"OPI","OPIATES-4":"OPI",
  "PHENCYCLIDINE":"PCP","PCP":"PCP",
  "MARIJUANA":"THC","THC":"THC","CANNABIS":"THC","MARIJUANA METABOLITES":"THC",
  "PROPOXYPHENE":"PPX","PPX":"PPX","PROPOXYPHENE MTB":"PPX",
  "6-AM":"6AM","6AM":"6AM","6-ACETYLMORPHINE":"6AM","HEROIN":"6AM",
  "METHAQUALONE":"MDM","MDM":"MDM",
  "NITRITE":"NIT","NIT":"NIT",
  "OXYCODONE":"OXC","OXYCODONE/OXYMORPHONE":"OXC","OXYC/OXYM":"OXC","OXC":"OXC",
  "FENTANYL":"FNL","FNL":"FNL",
  "CREATININE":"CREA","URINE CREATININE":"CREA","CREA":"CREA",
  "PH":"PH","URINE PH":"PH",
  "OP4":"OPI","OPIATES-4":"OPI",
  "MQU":"MDM","MEP":"MEP","MEPERIDINE":"MEP","HYC":"HYC","HYD":"HYD",
  "TRA":"TRA","TRAMADOL":"TRA","BUP":"BUP","BUPRENORPHINE":"BUP",
  "MDMA":"MDMA","MDMA/MDA":"MDMA",
  "CODEINE":"CODMOR","MORPHINE":"CODMOR","CODEINE/MORPHINE":"CODMOR","COD/MOR":"CODMOR"
};

const PANEL_INFO = {
  // Labcorp profiles
  "LAB-P1": {vendor:"Labcorp", name:"Profile 1"},
  "LAB-P2": {vendor:"Labcorp", name:"Profile 2"},
  "LAB-P3": {vendor:"Labcorp", name:"Profile 3"},
  "LAB-P4": {vendor:"Labcorp", name:"Profile 4"},
  "LAB-P5": {vendor:"Labcorp", name:"Profile 5"},
  "LAB-P6": {vendor:"Labcorp", name:"Profile 6"},
  "LAB-P7": {vendor:"Labcorp", name:"Profile 7"},
  "LAB-P8": {vendor:"Labcorp", name:"Profile 8"},
  "LAB-P9": {vendor:"Labcorp", name:"Profile 9"},

  // CRL panels
  "CRL-30C7": {vendor:"CRL", name:"30C7 — FED(LA)+SVT"},
  "CRL-47JL": {vendor:"CRL", name:"47JL — 7SAP(-THC)+EXNR/MDMA/MTD/SVT"},
  "CRL-30RY": {vendor:"CRL", name:"30RY — 10SAP+SVT"},
  "CRL-3002": {vendor:"CRL", name:"3002 — 9SAP+SVT"},
  "CRL-3009": {vendor:"CRL", name:"3009 — 5SAP+SVT"}
};

const PANELS = {
  // LABCORP
  "LAB-P1": ["AMP","COC","THC","OPI","PCP","NIT","6AM","CREA","PH"],
  "LAB-P2": ["AMP","BAR","COC","THC","OPI","PCP","BZP","MTD","NIT","OXC","6AM","CREA","PH"],
  "LAB-P3": ["AMP","BAR","COC","THC","OPI","PCP","BZP","MTD","MDM","PPX","OXC","6AM","TRA","BUP","CREA","PH","FNL"],
  "LAB-P4": ["AMP","BAR","COC","OPI","PCP","BZP","MTD","NIT","OXC","6AM","CREA","PH"],
  "LAB-P5": ["AMP","BAR","COC","THC","OPI","PCP","BZP","MTD","MDM","PPX","NIT","OXC","6AM","CREA","PH","FNL"],
  "LAB-P6": ["AMP","BAR","COC","THC","OPI","PCP","BZP","MTD","MDM","PPX","NIT","MEP","OXC","6AM","TRA","CREA","PH","HYD","FNL"],
  "LAB-P7": ["AMP","BAR","COC","OP4","PCP","BZP","MTD","MDM","NIT","MEP","TRA","BUP","CREA","PH","FNL"],
  "LAB-P8": ["AMP","BAR","COC","THC","OP4","PCP","BZP","MTD","PPX","NIT","CREA","PH"],
  "LAB-P9": ["AMP","BAR","COC","THC","MQU","OPI","PCP","BZP","MTD","PPX","NIT","OXC","6AM","CREA","PH"],

  // CRL
  "CRL-30C7": ["6AM","AMP","COC","THC","CODMOR","OXC","PCP","MDMA","HYC","CREA","PH","NIT"],
  "CRL-47JL": ["AMP","BAR","BZP","COC","MTD","MDMA","OXC","PCP","MEP","FNL","TRA","BUP","OPI","CREA","PH","NIT"],
  "CRL-30RY": ["AMP","BAR","BZP","COC","THC","MTD","MDM","PPX","PCP","OPI","CREA","PH","NIT"],
  "CRL-3002": ["AMP","BAR","BZP","COC","THC","MTD","PPX","PCP","OPI","CREA","PH","NIT"],
  "CRL-3009": ["AMP","COC","THC","PCP","OPI","CREA","PH","NIT"]
};

function normalizeToken(s){
  s = s.trim().toUpperCase().replace(/[()]/g,"").replace(/\s+/g," ");
  return ALIASES[s] || s;
}

function parseInput(text){
  // Handles commas, new lines, semicolons, bullets and common "and"
  return [...new Set(
    text.split(/[,;\n•]+/)
      .map(x => normalizeToken(x.replace(/\band\b/gi,"").trim()))
      .filter(x => x)
  )];
}

function name(code){
  return DRUGS[code] || code;
}

function matchPanels(){
  const required = parseInput(document.getElementById("input").value);
  const results = document.getElementById("results");
  results.innerHTML = "";

  if(!required.length){
    results.innerHTML = '<div class="card">Please enter at least one drug.</div>';
    return;
  }

  const ranked = Object.entries(PANELS).map(([panel, drugs])=>{
    const matched = required.filter(d => drugs.includes(d));
    const missing = required.filter(d => !drugs.includes(d));
    return {panel, matched, missing, pct: matched.length/required.length};
  }).sort((a,b)=> b.pct-a.pct || a.missing.length-b.missing.length);

  ranked.forEach(r=>{
    const cls = r.missing.length===0 ? "match" : (r.matched.length ? "partial" : "no");
    const label = r.missing.length===0 ? "MATCH" : (r.matched.length ? "PARTIAL MATCH" : "NO MATCH");
    const div = document.createElement("div");
    div.className = `result ${cls}`;
    const info = PANEL_INFO[r.panel] || {vendor:"", name:""};
    div.innerHTML = `
      <strong>${info.vendor ? info.vendor + " — " : ""}${info.name || r.panel}</strong><span class="badge">${label}</span>
      <div>Matched: ${r.matched.length}/${required.length}</div>
      ${r.missing.length ? `<div class="missing"><strong>Missing:</strong> ${r.missing.map(name).join(", ")}</div>` : `<div><strong>All requested drugs are present.</strong></div>`}
      ${r.matched.length ? `<div class="extra"><strong>Matched drugs:</strong> ${r.matched.map(name).join(", ")}</div>` : ""}
    `;
    results.appendChild(div);
  });
}
</script>
</body>
</html>
